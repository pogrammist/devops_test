services:
  nginx:
    image: nginx:1.30.4-alpine-slim
    restart: always
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - localnet

  backend:
    build: ./backend
    restart: always
    container_name: backend
    ports:
      - "8080:8080"
    networks:
      - localnet
    depends_on:
      - nginx

networks:
  localnet:
    driver: bridge
